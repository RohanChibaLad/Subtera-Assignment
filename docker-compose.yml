version: "3.9"
services:
  backend:
    build:
      context: ./backend
      target: prod
    environment:
      - DATABASE_URL=sqlite:////data/app.db
    volumes:
      - db_data:/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: "/api"
    ports:
      - "5173:80"   # serve app on localhost:5173 via Nginx
    depends_on:
      - backend

volumes:
  db_data:
