server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Single Page App fallback
  location / {
    try_files $uri /index.html;
  }

  # Proxy API calls
  location /api/ {
    proxy_pass http://backend:8000/;  # service name "backend" from compose
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
